<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grievance Officer Console</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header class="topbar">
        <div>
            <h1>🏥 Officer Console</h1>
            <div class="sub">Grievance Redressal — triage &amp; resolve</div>
        </div>
        <div class="links">
            <a href="/">Citizen site</a>
            <a href="#" id="logoutLink" class="hidden">Log out (<span id="whoami"></span>)</a>
        </div>
    </header>

    <!-- LOGIN -->
    <div class="container narrow" id="loginView">
        <div class="card">
            <h2>Officer login</h2>
            <p class="hint">Default admin: <code>admin@grievance.local</code> / your <code>ADMIN_PASSWORD</code>.</p>
            <div id="loginNotice"></div>
            <form id="loginForm">
                <label for="email">Email</label>
                <input id="email" type="email" value="admin@grievance.local" required />
                <label for="password">Password</label>
                <input id="password" type="password" required />
                <div class="btn-row"><button type="submit">Log in</button></div>
            </form>
        </div>
    </div>

    <!-- CONSOLE -->
    <div class="container hidden" id="consoleView">
        <div class="card">
            <h2>Overview</h2>
            <div class="stat-grid" id="stats"></div>
        </div>

        <div class="card">
            <h2>Inbox</h2>
            <div class="row" style="margin-bottom:12px;">
                <input id="search" placeholder="Search text or tracking no…" />
                <select id="fStatus">
                    <option value="">All statuses</option>
                    <option>NEW</option><option>ACKNOWLEDGED</option><option>IN_PROGRESS</option>
                    <option>RESOLVED</option><option>CLOSED</option><option>REOPENED</option>
                </select>
                <select id="fPriority">
                    <option value="">All priorities</option>
                    <option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option>
                </select>
                <label class="check" style="flex:0 0 auto;"><input type="checkbox" id="fUrgent" /> Urgent only</label>
                <button id="refreshBtn" style="flex:0 0 auto;">Refresh</button>
            </div>
            <div id="inbox"></div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div class="modal-backdrop" id="modal">
        <div class="modal">
            <header>
                <div><span class="tracking-no" id="mTracking"></span></div>
                <button class="close" id="mClose">&times;</button>
            </header>
            <div class="body" id="mBody"></div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('gr_token') || null;
        let me = JSON.parse(localStorage.getItem('gr_me') || 'null');

        const api = (p, opts = {}) => fetch('/api' + p, {
            ...opts,
            headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) }
        }).then(async r => {
            const body = await r.json().catch(() => ({}));
            if (r.status === 401) { doLogout(); throw new Error('Session expired — please log in again'); }
            if (!r.ok) throw new Error(body.error || 'Request failed');
            return body;
        });

        const esc = s => (s == null ? '' : String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])));
        const badge = (cls, txt) => `<span class="badge ${cls}">${txt}</span>`;

        function showConsole() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('consoleView').classList.remove('hidden');
            document.getElementById('logoutLink').classList.remove('hidden');
            document.getElementById('whoami').textContent = me?.name || me?.email || '';
            loadDashboard(); loadInbox();
        }
        function doLogout() {
            token = null; me = null;
            localStorage.removeItem('gr_token'); localStorage.removeItem('gr_me');
            document.getElementById('consoleView').classList.add('hidden');
            document.getElementById('logoutLink').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
        }

        document.getElementById('logoutLink').addEventListener('click', e => { e.preventDefault(); doLogout(); });

        document.getElementById('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            const notice = document.getElementById('loginNotice');
            notice.innerHTML = '';
            try {
                const res = await api('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                token = res.data.token; me = res.data.officer;
                localStorage.setItem('gr_token', token); localStorage.setItem('gr_me', JSON.stringify(me));
                showConsole();
            } catch (err) {
                notice.innerHTML = `<div class="notice err">${err.message}</div>`;
            }
        });

        async function loadDashboard() {
            try {
                const { data } = await api('/grievances/dashboard');
                const t = data.totals;
                document.getElementById('stats').innerHTML = `
                    <div class="stat"><div class="num">${t.total || 0}</div><div class="lbl">Total</div></div>
                    <div class="stat"><div class="num">${t.open || 0}</div><div class="lbl">Open</div></div>
                    <div class="stat alert"><div class="num">${t.urgentOpen || 0}</div><div class="lbl">Urgent open</div></div>
                    <div class="stat alert"><div class="num">${t.slaBreached || 0}</div><div class="lbl">SLA breached</div></div>
                    <div class="stat ok"><div class="num">${t.slaCompliancePct ?? 100}%</div><div class="lbl">SLA compliance</div></div>
                    <div class="stat"><div class="num">${t.resolved || 0}</div><div class="lbl">Resolved</div></div>`;
            } catch (e) { /* ignore */ }
        }

        async function loadInbox() {
            const params = new URLSearchParams({ limit: '50' });
            const s = document.getElementById('search').value.trim();
            if (s) params.set('search', s);
            const st = document.getElementById('fStatus').value; if (st) params.set('status', st);
            const pr = document.getElementById('fPriority').value; if (pr) params.set('priority', pr);
            if (document.getElementById('fUrgent').checked) params.set('isUrgent', 'true');
            const inbox = document.getElementById('inbox');
            inbox.innerHTML = '<p class="muted">Loading…</p>';
            try {
                const res = await api('/grievances?' + params.toString());
                if (!res.data.length) { inbox.innerHTML = '<p class="muted">No grievances match.</p>'; return; }
                const rows = res.data.map(g => `
                    <tr data-id="${g.id}">
                        <td><strong>${esc(g.trackingNo)}</strong><div class="meta muted">${esc(g.categoryName || 'Unclassified')}</div></td>
                        <td>${esc(g.aiSummary || g.title || '—')}</td>
                        <td>${badge(g.priority, g.priority)} ${g.isUrgent ? badge('urgent', 'URGENT') : ''}</td>
                        <td>${badge('status', g.status)}${g.slaBreached ? ' ' + badge('breach', 'SLA') : ''}</td>
                        <td class="meta">${esc(g.currentOwnerTier)}</td>
                    </tr>`).join('');
                inbox.innerHTML = `<table><thead><tr><th>Tracking</th><th>Summary</th><th>Priority</th><th>Status</th><th>Owner</th></tr></thead><tbody>${rows}</tbody></table>`;
                inbox.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => openDetail(tr.dataset.id)));
            } catch (err) {
                inbox.innerHTML = `<div class="notice err">${err.message}</div>`;
            }
        }

        ['refreshBtn'].forEach(id => document.getElementById(id).addEventListener('click', () => { loadDashboard(); loadInbox(); }));
        ['search', 'fStatus', 'fPriority', 'fUrgent'].forEach(id => document.getElementById(id).addEventListener('change', loadInbox));
        document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') loadInbox(); });

        // ---- Detail modal ----
        const modal = document.getElementById('modal');
        document.getElementById('mClose').addEventListener('click', () => modal.classList.remove('open'));
        modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

        async function openDetail(id) {
            modal.classList.add('open');
            document.getElementById('mBody').innerHTML = '<p class="muted">Loading…</p>';
            const { data: g } = await api('/grievances/' + id);
            document.getElementById('mTracking').textContent = g.trackingNo;
            renderDetail(g);
        }

        function renderDetail(g) {
            const tl = g.timeline.map(t => `
                <li><strong>${esc(t.eventType.replace(/_/g,' '))}</strong>${t.toStatus ? ' → ' + esc(t.toStatus) : ''}
                    ${t.isInternal ? ' <span class="badge breach">internal</span>' : ''}
                    <div>${esc(t.comment || '')}</div>
                    <div class="meta">${esc(t.actorName || '')} · ${new Date(t.createdAt).toLocaleString()}</div></li>`).join('');

            document.getElementById('mBody').innerHTML = `
                <div style="margin-bottom:10px;">
                    ${badge(g.priority, g.priority)} ${g.isUrgent ? badge('urgent', 'URGENT') : ''} ${badge('status', g.status)}
                </div>
                <div class="kv">
                    <div class="k">Category</div><div>${esc(g.categoryName || 'Unclassified')}</div>
                    <div class="k">Complaint</div><div>${esc(g.description)}</div>
                    ${g.aiSummary ? `<div class="k">AI summary</div><div>${esc(g.aiSummary)}</div>` : ''}
                    <div class="k">Language</div><div>${esc(g.language || '—')}</div>
                    <div class="k">Location</div><div>${esc(g.locationText || '—')}</div>
                    <div class="k">Owner tier</div><div>${esc(g.currentOwnerTier)}</div>
                    <div class="k">SLA due</div><div>${g.slaDueAt ? new Date(g.slaDueAt).toLocaleString() : '—'}</div>
                    <div class="k">Complainant</div><div>${g.isAnonymous ? 'Anonymous' : esc(g.complainantName || '—') + (g.complainantMobile ? ' · ' + esc(g.complainantMobile) : '')}</div>
                </div>

                <div class="row" style="margin-top:14px;">
                    <select id="aStatus">
                        <option value="">Change status…</option>
                        <option>ACKNOWLEDGED</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option><option>REOPENED</option>
                    </select>
                    <select id="aTier">
                        <option value="">Escalate to…</option>
                        <option>DISTRICT</option><option>DIVISION</option><option>STATE</option>
                    </select>
                </div>
                <div class="btn-row">
                    <button id="bStatus" class="secondary">Apply status</button>
                    <button id="bAssign" class="secondary">Assign to me</button>
                    <button id="bEscalate" class="secondary">Escalate</button>
                    <button id="bReclass" class="ghost">↻ Re-run AI</button>
                    <button id="bDraft" class="ghost">✍ AI draft reply</button>
                </div>
                <div id="draftBox"></div>

                <label for="cComment" style="margin-top:16px;">Add a note</label>
                <textarea id="cComment" style="min-height:70px;"></textarea>
                <div class="check"><input type="checkbox" id="cInternal" /><label for="cInternal" style="margin:0;">Internal (hidden from citizen)</label></div>
                <div class="btn-row"><button id="bComment" class="secondary">Add note</button></div>

                <h2 style="margin-top:20px;font-size:15px;">Timeline</h2>
                <ul class="timeline">${tl}</ul>`;

            const gid = g.id;
            const reload = async () => { const { data } = await api('/grievances/' + gid); renderDetail(data); loadInbox(); loadDashboard(); };

            document.getElementById('bStatus').onclick = async () => {
                const status = document.getElementById('aStatus').value;
                if (!status) return;
                await api(`/grievances/${gid}/status`, { method: 'PATCH', body: JSON.stringify({ status, comment: document.getElementById('cComment').value || undefined }) });
                reload();
            };
            document.getElementById('bAssign').onclick = async () => {
                await api(`/grievances/${gid}/assign`, { method: 'PATCH', body: JSON.stringify({ assignedToOfficerId: me.id }) });
                reload();
            };
            document.getElementById('bEscalate').onclick = async () => {
                const toTier = document.getElementById('aTier').value;
                if (!toTier) return;
                await api(`/grievances/${gid}/escalate`, { method: 'PATCH', body: JSON.stringify({ toTier, reason: document.getElementById('cComment').value || undefined }) });
                reload();
            };
            document.getElementById('bComment').onclick = async () => {
                const comment = document.getElementById('cComment').value.trim();
                if (!comment) return;
                await api(`/grievances/${gid}/comments`, { method: 'POST', body: JSON.stringify({ comment, isInternal: document.getElementById('cInternal').checked }) });
                reload();
            };
            document.getElementById('bReclass').onclick = async () => { await api(`/grievances/${gid}/reclassify`, { method: 'POST' }); reload(); };
            document.getElementById('bDraft').onclick = async () => {
                const box = document.getElementById('draftBox');
                box.innerHTML = '<p class="muted">Generating with local AI…</p>';
                try {
                    const { data } = await api(`/grievances/${gid}/draft-reply?kind=${g.status === 'RESOLVED' || g.status === 'CLOSED' ? 'resolution' : 'acknowledgement'}`);
                    box.innerHTML = data.draft
                        ? `<div class="ai-box">${esc(data.draft)}</div>`
                        : '<div class="notice err">AI is unavailable (Ollama not running).</div>';
                } catch (e) { box.innerHTML = `<div class="notice err">${e.message}</div>`; }
            };
        }

        // Auto-resume session
        if (token && me) showConsole();
    </script>
</body>
</html>
