<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helpdesk — Agent Console</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header class="topbar">
        <div><h1>🎫 Agent Console</h1><div class="sub">Smart Helpdesk — recommendations &amp; routing</div></div>
        <div class="links"><a href="/">Submit site</a><a href="#" id="logout" class="hidden">Log out (<span id="who"></span>)</a></div>
    </header>

    <!-- LOGIN -->
    <div class="container narrow" id="loginView">
        <div class="card">
            <h2>Agent login</h2>
            <p class="hint">Admin: <code>admin@helpdesk.local</code> / <code>ADMIN_PASSWORD</code>. Agents: <code>priya@ / arjun@ / neha@ / rohit@helpdesk.local</code> / <code>agent123</code>.</p>
            <div id="loginNotice"></div>
            <form id="loginForm">
                <label>Email</label><input id="email" type="email" value="arjun@helpdesk.local" />
                <label>Password</label><input id="password" type="password" value="agent123" />
                <div class="btn-row"><button type="submit">Log in</button></div>
            </form>
        </div>
    </div>

    <!-- CONSOLE -->
    <div class="container hidden" id="consoleView">
        <div class="card">
            <div class="row" style="margin-bottom:12px">
                <input id="search" placeholder="Search subject / body / ref…" />
                <select id="fStatus"><option value="">All statuses</option><option>OPEN</option><option>ASSIGNED</option><option>IN_PROGRESS</option><option>PENDING</option><option>RESOLVED</option><option>CLOSED</option></select>
                <select id="fPriority"><option value="">All priorities</option><option>URGENT</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select>
                <label style="display:flex;align-items:center;gap:6px;flex:0 0 auto;margin:0"><input type="checkbox" id="fMine" style="width:auto"> Mine</label>
                <button id="refresh" style="flex:0 0 auto">Refresh</button>
            </div>
            <div id="queue"></div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div class="modal-backdrop" id="modal">
        <div class="modal">
            <header><div><span class="ref" id="mRef"></span></div><button class="close" id="mClose">&times;</button></header>
            <div class="body" id="mBody"></div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('hd_token'), me = JSON.parse(localStorage.getItem('hd_me') || 'null'), agents = [];
        const api = (p, o = {}) => fetch('/api' + p, { ...o, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(o.headers || {}) } })
            .then(async r => { const b = await r.json().catch(() => ({})); if (r.status === 401) { logout(); throw new Error('Session expired'); } if (!r.ok) throw new Error(b.error || 'Failed'); return b; });
        const esc = s => s == null ? '' : String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        const badge = (c, t) => `<span class="badge ${c}">${t}</span>`;

        function showConsole() {
            loginView.classList.add('hidden'); consoleView.classList.remove('hidden'); logout.classList.remove('hidden');
            who.textContent = me?.name || me?.email;
            api('/tickets/agents').then(r => agents = r.data).catch(() => {});
            loadQueue();
        }
        function logout() { token = null; me = null; localStorage.removeItem('hd_token'); localStorage.removeItem('hd_me'); consoleView.classList.add('hidden'); logout.classList.add('hidden'); loginView.classList.remove('hidden'); }
        document.getElementById('logout').addEventListener('click', e => { e.preventDefault(); logout(); });

        document.getElementById('loginForm').addEventListener('submit', async e => {
            e.preventDefault(); loginNotice.innerHTML = '';
            try { const r = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: email.value, password: password.value }) });
                token = r.data.token; me = r.data.agent; localStorage.setItem('hd_token', token); localStorage.setItem('hd_me', JSON.stringify(me)); showConsole();
            } catch (err) { loginNotice.innerHTML = `<div class="notice err">${err.message}</div>`; }
        });

        async function loadQueue() {
            const p = new URLSearchParams({ limit: '50' });
            if (search.value.trim()) p.set('search', search.value.trim());
            if (fStatus.value) p.set('status', fStatus.value);
            if (fPriority.value) p.set('priority', fPriority.value);
            if (fMine.checked) p.set('assignedAgentId', 'me');
            queue.innerHTML = '<p class="muted">Loading…</p>';
            try {
                const r = await api('/tickets?' + p);
                if (!r.data.length) { queue.innerHTML = '<p class="muted">No tickets.</p>'; return; }
                queue.innerHTML = `<table><thead><tr><th>Ref</th><th>Subject</th><th>Priority</th><th>Status</th><th>Assignee</th></tr></thead><tbody>${
                    r.data.map(t => `<tr data-id="${t.id}"><td><strong>${esc(t.refNo)}</strong><div class="muted" style="font-size:12px">${esc(t.categoryName || '—')}</div></td>
                    <td>${esc(t.aiSummary || t.subject)}</td><td>${badge(t.priority, t.priority)}</td><td>${badge('status', t.status)}</td><td class="muted">${esc(t.assignedAgentName || '—')}</td></tr>`).join('')
                }</tbody></table>`;
                queue.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => openDetail(tr.dataset.id)));
            } catch (err) { queue.innerHTML = `<div class="notice err">${err.message}</div>`; }
        }
        refresh.addEventListener('click', loadQueue);
        ['fStatus', 'fPriority', 'fMine'].forEach(id => document.getElementById(id).addEventListener('change', loadQueue));
        search.addEventListener('keydown', e => { if (e.key === 'Enter') loadQueue(); });

        const modal = document.getElementById('modal');
        mClose.addEventListener('click', () => modal.classList.remove('open'));
        modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

        async function openDetail(id) {
            modal.classList.add('open'); mBody.innerHTML = '<p class="muted">Loading…</p>';
            const { data: t } = await api('/tickets/' + id); render(t);
        }

        function render(t) {
            mRef.textContent = t.refNo;
            const rec = t.recommendation || {};
            const ra = rec.recommendedAgent;
            const sims = (rec.similar || []).map(s => `
                <div class="simitem">
                    <div><strong>${esc(s.refNo || '')}</strong> ${esc(s.subject)} ${s.agentName ? '· <span class="muted">' + esc(s.agentName) + '</span>' : ''} ${badge('status', s.status)}</div>
                    <div class="muted">${(s.score * 100).toFixed(0)}% match${s.resolution ? ' · ' + esc(s.resolution.slice(0, 90)) + '…' : ''}</div>
                    <div class="bar"><span style="width:${Math.min(100, s.score * 100)}%"></span></div>
                </div>`).join('') || '<p class="muted">No similar past tickets.</p>';

            const msgs = t.messages.map(m => `<div class="msg ${m.direction}"><div class="meta">${m.direction}${m.isInternal ? ' · internal' : ''} · ${esc(m.authorName || 'agent')} · ${new Date(m.createdAt).toLocaleString()}</div>${esc(m.body)}</div>`).join('');
            const agentOpts = agents.filter(a => a.role === 'agent').map(a => `<option value="${a.id}" ${a.id === t.assignedAgentId ? 'selected' : ''}>${esc(a.name)}${a.skills ? ' — ' + esc(a.skills) : ''}</option>`).join('');

            mBody.innerHTML = `
              <div class="grid2">
                <div>
                    <div style="margin-bottom:8px">${badge(t.priority, t.priority)} ${badge('status', t.status)} ${t.aiProcessed ? badge('ai', 'AI classified') : ''}</div>
                    <div class="kv">
                        <div class="k">Subject</div><div>${esc(t.subject)}</div>
                        <div class="k">From</div><div>${esc(t.requesterName || '—')} ${t.requesterEmail ? '&lt;' + esc(t.requesterEmail) + '&gt;' : ''} · <span class="muted">${t.source}</span></div>
                        <div class="k">Category</div><div>${esc(t.categoryName || '—')}</div>
                        <div class="k">Assignee</div><div>${esc(t.assignedAgentName || 'Unassigned')}</div>
                        ${t.aiSummary ? `<div class="k">AI summary</div><div>${esc(t.aiSummary)}</div>` : ''}
                        <div class="k">Message</div><div>${esc(t.body)}</div>
                    </div>

                    <h2 style="margin-top:14px;font-size:14px">Conversation</h2>${msgs || '<p class="muted">No messages.</p>'}
                    <label>Reply / note</label><textarea id="replyBody" style="min-height:70px"></textarea>
                    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="replyInternal" style="width:auto"> Internal note</label>
                    <div class="btn-row">
                        <button id="bReply" class="secondary">Save reply</button>
                        <button id="bDraft" class="ghost">✍ AI draft (from similar)</button>
                    </div>
                    <div id="draftBox"></div>
                </div>

                <div>
                    <div class="reco">
                        <h3>🧭 Recommended agent</h3>
                        ${ra ? `<div><strong>${esc(ra.agentName)}</strong> <span class="muted">(${esc(rec.source)})</span><div class="muted">${esc(ra.reason)}${ra.basedOn ? ' · score ' + ra.score : ''}</div></div>
                                <div class="btn-row"><button id="bAssignRec">Assign to ${esc(ra.agentName)}</button></div>` : '<p class="muted">No recommendation.</p>'}
                    </div>
                    <div class="reco">
                        <h3>🔎 Similar past tickets</h3>${sims}
                    </div>
                    <div class="card" style="box-shadow:none;margin:0">
                        <label>Assign to</label>
                        <select id="assignSel">${agentOpts}</select>
                        <div class="btn-row">
                            <button id="bAssign" class="secondary">Assign</button>
                            <button id="bMine" class="ghost">Assign to me</button>
                        </div>
                        <label style="margin-top:10px">Status</label>
                        <select id="statusSel">
                            ${['OPEN', 'ASSIGNED', 'IN_PROGRESS', 'PENDING', 'RESOLVED', 'CLOSED', 'REOPENED'].map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                        <label>Resolution (when resolving)</label>
                        <textarea id="resolutionBody" style="min-height:56px" placeholder="What fixed it — future similar tickets learn from this">${esc(t.resolution || '')}</textarea>
                        <div class="btn-row"><button id="bStatus" class="secondary">Update status</button></div>
                    </div>
                </div>
              </div>`;

            const id = t.id, reload = async () => { const { data } = await api('/tickets/' + id); render(data); loadQueue(); };
            const rb = document.getElementById('bAssignRec'); if (rb) rb.onclick = async () => { await api(`/tickets/${id}/assign`, { method: 'PATCH', body: JSON.stringify({ agentId: ra.agentId }) }); reload(); };
            document.getElementById('bAssign').onclick = async () => { await api(`/tickets/${id}/assign`, { method: 'PATCH', body: JSON.stringify({ agentId: Number(assignSel.value) }) }); reload(); };
            document.getElementById('bMine').onclick = async () => { await api(`/tickets/${id}/assign-to-me`, { method: 'POST' }); reload(); };
            document.getElementById('bStatus').onclick = async () => { await api(`/tickets/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status: statusSel.value, resolution: resolutionBody.value || undefined }) }); reload(); };
            document.getElementById('bReply').onclick = async () => { const b = replyBody.value.trim(); if (!b) return; await api(`/tickets/${id}/reply`, { method: 'POST', body: JSON.stringify({ body: b, isInternal: replyInternal.checked }) }); reload(); };
            document.getElementById('bDraft').onclick = async () => {
                const box = document.getElementById('draftBox'); box.innerHTML = '<p class="muted">Drafting with Groq…</p>';
                try { const { data } = await api(`/tickets/${id}/draft-reply`);
                    box.innerHTML = data.draft ? `<div class="ai-box">${esc(data.draft)}</div><div class="btn-row"><button class="ghost" id="useDraft">Use this</button></div>` : '<div class="notice err">AI unavailable — set GROQ_API_KEY.</div>';
                    const u = document.getElementById('useDraft'); if (u) u.onclick = () => { replyBody.value = data.draft; };
                } catch (e) { box.innerHTML = `<div class="notice err">${e.message}</div>`; }
            };
        }

        if (token && me) showConsole();
    </script>
</body>
</html>
